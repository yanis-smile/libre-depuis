<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libre depuis</title>
<meta name="description" content="Comptez le temps depuis l’arrêt d’une addiction et suivez les bienfaits, étape par étape.">
<meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libre depuis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">
  <div id="view"></div>
</main>

<button type="button" class="fab" id="fab" data-action="add" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Ajouter
</button>

<div class="scrim" id="sheet" hidden>
  <form class="sheet" id="sheet-form" novalidate aria-labelledby="sheet-title">
    <h2 id="sheet-title">Nouvelle addiction</h2>
    <div class="field">
      <label for="f-name">Nom</label>
      <input id="f-name" name="name" type="text" maxlength="60" autocomplete="off" placeholder="Ex. : cigarette, alcool, sucre, réseaux sociaux">
      <div class="suggest" id="f-suggest"></div>
    </div>
    <fieldset class="field">
      <legend>Type</legend>
      <div class="chips" id="f-types"></div>
    </fieldset>
    <p class="hint">Le type choisit les bienfaits affichés étape par étape.</p>
    <div class="field-row">
      <div class="field">
        <label for="f-date">Date d’arrêt</label>
        <input id="f-date" name="date" type="date">
      </div>
      <div class="field">
        <label for="f-time">Heure</label>
        <input id="f-time" name="time" type="time">
      </div>
    </div>
    <p class="hint">Sans heure, le compteur part de minuit ce jour-là.</p>
    <p class="form-error" id="f-error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn--ghost" data-action="sheet-cancel">Annuler</button>
      <button type="submit" class="btn btn--primary" id="f-submit">Enregistrer</button>
    </div>
  </form>
</div>

<div class="scrim" id="goal-sheet" hidden>
  <form class="sheet" id="goal-form" novalidate aria-labelledby="goal-title">
    <h2 id="goal-title">Nouvel objectif</h2>
    <p class="sheet-sub" id="goal-sub"></p>
    <div class="field-row field-row--even">
      <div class="field">
        <label for="g-n">Au bout de</label>
        <input id="g-n" name="n" type="number" inputmode="numeric" min="1" max="999" step="1">
      </div>
      <div class="field">
        <label for="g-u">Unité</label>
        <div class="select-wrap">
          <select id="g-u" name="u">
            <option value="h">heures</option>
            <option value="d">jours</option>
            <option value="w">semaines</option>
            <option value="m">mois</option>
            <option value="y">ans</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="g-text">Objectif</label>
      <input id="g-text" name="text" type="text" maxlength="80" autocomplete="off" placeholder="Ex. : m’offrir un bon restaurant">
    </div>
    <p class="form-error" id="g-error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn--ghost" data-action="goal-cancel">Annuler</button>
      <button type="submit" class="btn btn--primary" id="g-submit">Ajouter l’objectif</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
